name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 👷 Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"

      - name: 👷Install dependencies
        run: uv sync --all-groups

      - name: 🎨 Check formatting
        run: uv run ruff format --check .

      - name: 🚨 Lint (includes import order)
        run: uv run ruff check .

      - name: 🧪 Test
        run: uv run pytest

  pages:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 👷 Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"

      - name: 👷 Install dependencies
        run: uv sync --all-groups

      - name: 🧪📊 Generate test and coverage reports
        run: |
          uv run pytest \
            --cov=src --cov-report=html:site/coverage --cov-report=json:site/coverage.json \
            --html=site/report.html --self-contained-html

      - name: 🏷️ Build coverage badge and landing page
        run: python .github/scripts/build_pages_report.py

      - name: 📦 Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

